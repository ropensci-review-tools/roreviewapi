<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pladdrr network</title>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    Helvetica, Arial, sans-serif;
  margin: 0;
  color: #222;
}

#pkgstats-header {
  padding: 12px 20px 0 20px;
}

#pkgstats-header h1 {
  font-size: 1.4em;
  margin: 0;
}

#pkgstats-subtitle {
  font-size: 0.85em;
  color: #666;
  margin: 4px 0 0 0;
}

#pkgstats-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px 0 20px;
  font-size: 0.85em;
}

#pkgstats-node-select {
  font-size: 1em;
  padding: 2px 6px;
}

#pkgstats-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 8px 20px;
  font-size: 0.85em;
}

.pkgstats-legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

.pkgstats-legend-swatch {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
}

#pkgstats-network {
  width: 100%;
}

#pkgstats-network svg {
  display: block;
}

.pkgstats-node-label {
  font-size: 8px;
  fill: #333;
  dominant-baseline: middle;
  pointer-events: none;
  user-select: none;
}

.pkgstats-tooltip {
  position: absolute;
  pointer-events: none;
  background: #ffffe1;
  color: #222;
  border: 1px solid #c8c8a0;
  padding: 4px 8px;
  border-radius: 3px;
  font-size: 0.8em;
}

</style>
</head>
<body>
<div id="pkgstats-header">
<h1>pladdrr network</h1>
<p id="pkgstats-subtitle">Edge thickness scaled to network centrality &middot; node sizes scaled to numbers of times each fn is called</p>
</div>
<div id="pkgstats-controls">
<label for="pkgstats-node-select">Highlight function:</label>
<select id="pkgstats-node-select"></select>
</div>
<div id="pkgstats-legend"></div>
<div id="pkgstats-network"></div>

<script>
// Force-directed network graph skeleton for pkgstats, built on D3 v7.
// Populated at runtime with a `{nodes, edges}` data object.
(function () {
  "use strict";

  function pkgstatsNetworkPlot (data, opts) {
    opts = opts || {};

    var nodes = (data.nodes || []).map (function (d) {
      return Object.assign ({}, d);
    });
    var nodeIds = new Set (nodes.map (function (d) {
      return d.id;
    }));
    // drop dangling edges, i.e. those referencing endpoints with no
    // corresponding node (d3-force throws if these are not removed), and
    // map "from"/"to" onto the "source"/"target" fields expected by
    // d3.forceLink
    var links = (data.edges || [])
      .filter (function (d) {
        return nodeIds.has (d.from) && nodeIds.has (d.to);
      })
      .map (function (d) {
        return Object.assign ({}, d, { source: d.from, target: d.to });
      });

    var container = document.getElementById ("pkgstats-network");
    var width = opts.width || container.clientWidth || window.innerWidth;
    var height = opts.height || window.innerHeight - 140;

    var groups = Array.from (new Set (nodes.map (function (d) {
      return d.group;
    }))).sort ();
    var color = d3.scaleOrdinal (groups, d3.schemeTableau10);

    var maxValue = d3.max (nodes, function (d) {
      return d.value;
    }) || 1;
    var radius = d3.scaleSqrt ().domain ([0, maxValue]).range ([4, 22]);

    var maxWidth = d3.max (links, function (d) {
      return d.width;
    }) || 1;
    var strokeWidth = d3.scaleLinear ()
      .domain ([0, maxWidth])
      .range ([0.6, 6]);

    var svg = d3.select ("#pkgstats-network")
      .append ("svg")
      .attr ("viewBox", [0, 0, width, height])
      .attr ("width", width)
      .attr ("height", height)
      .attr ("style", "max-width: 100%; height: auto;");

    var highlightColor = "#e6194b";
    // default stroke/arrow colour for edges
    var edgeColor = "#888";

    svg.append ("defs").selectAll ("marker")
      .data ([
        { id: "pkgstats-arrow", fill: edgeColor },
        { id: "pkgstats-arrow-highlight", fill: highlightColor },
      ])
      .join ("marker")
      .attr ("id", function (d) {
        return d.id;
      })
      .attr ("viewBox", "0 -5 10 10")
      .attr ("refX", 16)
      .attr ("refY", 0)
      .attr ("markerWidth", 5)
      .attr ("markerHeight", 5)
      .attr ("orient", "auto")
      .append ("path")
      .attr ("fill", function (d) {
        return d.fill;
      })
      .attr ("d", "M0,-5L10,0L0,5");

    var g = svg.append ("g");

    svg.on ("click", function () {
      selectedNodeId = null;
      if (select) select.value = "";
      updateHighlight ();
    });

    var zoom = d3.zoom ()
      .scaleExtent ([0.1, 8])
      .on ("zoom", function (event) {
        g.attr ("transform", event.transform);
      });

    svg.call (zoom);

    var simulation = d3.forceSimulation (nodes)
      .force ("link", d3.forceLink (links).id (function (d) {
        return d.id;
      }).distance (60).strength (0.3))
      .force ("charge", d3.forceManyBody ().strength (-180))
      .force ("center", d3.forceCenter (width / 2, height / 2))
      .force ("collide", d3.forceCollide ().radius (function (d) {
        return radius (d.value) + 4;
      }));

    var link = g.append ("g")
      .selectAll ("line")
      .data (links)
      .join ("line")
      .attr ("stroke", edgeColor)
      .attr ("stroke-opacity", 0.6)
      .attr ("stroke-width", function (d) {
        return strokeWidth (d.width);
      })
      .attr ("marker-end", "url(#pkgstats-arrow)");

    var selectedNodeId = null;

    function isConnected (d) {
      return selectedNodeId !== null &&
        (d.source.id === selectedNodeId || d.target.id === selectedNodeId);
    }

    function updateHighlight () {
      link
        .attr ("stroke", function (d) {
          return isConnected (d) ? highlightColor : edgeColor;
        })
        .attr ("stroke-opacity", function (d) {
          return selectedNodeId !== null && !isConnected (d) ? 0.15 : 0.6;
        })
        .attr ("stroke-width", function (d) {
          return isConnected (d) ?
            strokeWidth (d.width) + 4 :
            strokeWidth (d.width);
        })
        .attr ("marker-end", function (d) {
          return isConnected (d) ?
            "url(#pkgstats-arrow-highlight)" :
            "url(#pkgstats-arrow)";
        });
      nodeHighlight
        .attr ("opacity", function (d) {
          return d.id === selectedNodeId ? 0.9 : 0;
        });
    }

    // pan/zoom the view so the selected node and its direct connections are
    // centred and occupy at most half of the viewBox, in either dimension
    function zoomToSelection (id) {
      var selected = nodes.find (function (d) {
        return d.id === id;
      });
      if (!selected) return;

      var connectedIds = new Set ([id]);
      links.forEach (function (l) {
        if (l.source.id === id) connectedIds.add (l.target.id);
        if (l.target.id === id) connectedIds.add (l.source.id);
      });
      var clusterNodes = nodes.filter (function (d) {
        return connectedIds.has (d.id);
      });

      var x0 = d3.min (clusterNodes, function (d) {
        return d.x - radius (d.value);
      });
      var x1 = d3.max (clusterNodes, function (d) {
        return d.x + radius (d.value);
      });
      var y0 = d3.min (clusterNodes, function (d) {
        return d.y - radius (d.value);
      });
      var y1 = d3.max (clusterNodes, function (d) {
        return d.y + radius (d.value);
      });

      var bw = Math.max (x1 - x0, 1);
      var bh = Math.max (y1 - y0, 1);
      var cx = (x0 + x1) / 2;
      var cy = (y0 + y1) / 2;

      var scale = Math.min (
        (width * 0.5) / bw,
        (height * 0.5) / bh,
        8
      );
      scale = Math.max (scale, 0.1);

      var transform = d3.zoomIdentity
        .translate (width / 2, height / 2)
        .scale (scale)
        .translate (-cx, -cy);

      svg.transition ()
        .duration (750)
        .call (zoom.transform, transform);
    }

    var select = document.getElementById ("pkgstats-node-select");
    if (select) {
      var placeholder = document.createElement ("option");
      placeholder.value = "";
      placeholder.textContent = "(none)";
      select.appendChild (placeholder);

      nodes.slice ()
        .sort (function (a, b) {
          return a.label.localeCompare (b.label);
        })
        .forEach (function (d) {
          var option = document.createElement ("option");
          option.value = d.id;
          option.textContent = d.label;
          select.appendChild (option);
        });

      select.addEventListener ("change", function () {
        selectedNodeId = select.value || null;
        updateHighlight ();
        if (selectedNodeId) zoomToSelection (selectedNodeId);
      });
    }

    var tooltip = d3.select ("body").append ("div")
      .attr ("class", "pkgstats-tooltip")
      .style ("opacity", 0);

    var nodeHighlight = g.append ("g")
      .selectAll ("circle")
      .data (nodes)
      .join ("circle")
      .attr ("class", "pkgstats-node-highlight")
      .attr ("r", function (d) {
        return radius (d.value) + 5;
      })
      .attr ("fill", highlightColor)
      .attr ("opacity", 0);

    var node = g.append ("g")
      .attr ("stroke", "#fff")
      .attr ("stroke-width", 1.5)
      .selectAll ("circle")
      .data (nodes)
      .join ("circle")
      .attr ("r", function (d) {
        return radius (d.value);
      })
      .attr ("fill", function (d) {
        return color (d.group);
      })
      .style ("cursor", "pointer")
      .call (drag (simulation))
      .on ("click", function (event, d) {
        event.stopPropagation ();
        selectedNodeId = (selectedNodeId === d.id) ? null : d.id;
        if (select) select.value = selectedNodeId || "";
        updateHighlight ();
      })
      .on ("mouseover", function (event, d) {
        tooltip.transition ().duration (100).style ("opacity", 0.95);
        tooltip.html (
          "<strong>" + d.label + "</strong><br>" +
          d.file
        )
          .style ("left", (event.pageX + 12) + "px")
          .style ("top", (event.pageY - 20) + "px");
      })
      .on ("mousemove", function (event) {
        tooltip.style ("left", (event.pageX + 12) + "px")
          .style ("top", (event.pageY - 20) + "px");
      })
      .on ("mouseout", function () {
        tooltip.transition ().duration (200).style ("opacity", 0);
      });

    var label = g.append ("g")
      .attr ("class", "pkgstats-node-labels")
      .selectAll ("text")
      .data (nodes)
      .join ("text")
      .attr ("class", "pkgstats-node-label")
      .text (function (d) {
        return d.label;
      });

    simulation.on ("tick", function () {
      link
        .attr ("x1", function (d) {
          return d.source.x;
        })
        .attr ("y1", function (d) {
          return d.source.y;
        })
        .attr ("x2", function (d) {
          return d.target.x;
        })
        .attr ("y2", function (d) {
          return d.target.y;
        });
      node
        .attr ("cx", function (d) {
          return d.x;
        })
        .attr ("cy", function (d) {
          return d.y;
        });
      nodeHighlight
        .attr ("cx", function (d) {
          return d.x;
        })
        .attr ("cy", function (d) {
          return d.y;
        });
      label
        .attr ("x", function (d) {
          return d.x + radius (d.value) + 3;
        })
        .attr ("y", function (d) {
          return d.y;
        });
    });

    function drag (sim) {
      function dragstarted (event, d) {
        if (!event.active) sim.alphaTarget (0.3).restart ();
        d.fx = d.x;
        d.fy = d.y;
      }
      function dragged (event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }
